<!DOCTYPE html>
<html lang="ja">

<head>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-512.png">
  <meta name="theme-color" content="#000000">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="会計電卓">

  <title>会計電卓</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      padding: 20px 18px 8px;
      display: flex;
flex-direction: column;
    }

    /* 上部 */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
    }

    .title {
      font-size: 14px;
      color: #888;
    }

    /* 右上の会計ボタン */
    .checkout {
      width: auto;
      height: 42px;
      padding: 0 18px;
      margin: 0;

      border: none;
      border-radius: 21px;

      background: #e32636;
      color: white;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
      touch-action: manipulation;
    }

    .checkout:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    /* 表示部分 */
    .display {
      width: 100%;
      height: 120px;
      padding: 12px 8px 18px;

      display: flex;
      align-items: flex-end;
      justify-content: flex-end;

      font-size: 52px;
      font-weight: 400;

      white-space: nowrap;
      overflow: hidden;
    }

    /* 電卓 */
    .buttons {
      margin-top: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .buttons button {
      border: none;

      width: 100%;
      aspect-ratio: 1 / 1;
      height: auto;

      border-radius: 50%;

      font-size: 27px;
      font-weight: 500;

      background: #333336;
      color: white;

      cursor: pointer;
      touch-action: manipulation;
    }

    .buttons button:active {
      transform: scale(0.94);
      opacity: 0.75;
    }

    /* 演算子 */
    .buttons .operator,
    .buttons .equals {
      background: #ff9f0a;
      color: white;
      font-size: 34px;
    }

    /* C・⌫ */
    .buttons .clear,
    .buttons .utility {
      background: #a5a5a5;
      color: #000;
    }

    /* 空白キー */
    .buttons .blank {
      background: #a5a5a5;
      cursor: default;
    }

    .buttons .blank:active {
      transform: none;
      opacity: 1;
    }

    /* 0だけ横長 */
    .buttons .zero {
      grid-column: span 2;
      aspect-ratio: auto;
      border-radius: 999px;
      text-align: left;
      padding-left: 29px;
    }

    /* 結果 */
    .results {
      display: none;
      margin-top: 28px;
    }

    .result-card {
      background: #1c1c20;
      border: 1px solid #333338;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 12px;
    }

    .result-title {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .total {
      font-size: 40px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .result-card:first-child .total {
      color: #ffffff;
    }

    .result-card:nth-child(2) .total {
      color: #ff4d5a;
    }

    .row {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      padding: 8px 0;
      color: #aaa;
    }

    .row span:last-child {
      color: white;
      font-weight: 600;
    }

    /* 割り勘 */
    .split-card {
      background: #1c1c20;
      border: 1px solid #333338;
      border-radius: 20px;
      padding: 18px;
      margin-top: 22px;
    }

    .split-title {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 18px;
    }

    .people-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 24px;
    }

    .people-button {
      width: 58px;
      height: 50px;
      border-radius: 25px;

      border: none;

      font-size: 26px;

      background: #3a3a40;
      color: white;

      cursor: pointer;
      touch-action: manipulation;
    }

    .people-button:active {
      transform: scale(0.96);
      opacity: 0.8;
    }

    .people-number {
      min-width: 70px;
      text-align: center;
      font-size: 25px;
      font-weight: 700;
    }

    .split-result {
      padding: 14px 0;
      border-top: 1px solid #333338;
    }

    .split-result:last-child {
      padding-bottom: 0;
    }

    .split-label {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .split-amount {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.6;
    }

    .split-result.card .split-amount {
      color: #ff4d5a;
    }

    /* 会計金額ランク演出 */

    /* 30,000円以上：銅の光 */
    .total.bronze {
      text-shadow:
        0 0 5px #b87333,
        0 0 10px #cd7f32,
        0 0 18px rgba(205, 127, 50, 0.8),
        0 0 28px rgba(184, 115, 51, 0.5);
    }

    /* 50,000円以上：銀の光 */
    .total.silver {
      text-shadow:
        0 0 5px #ffffff,
        0 0 10px #d8d8d8,
        0 0 18px rgba(220, 220, 220, 0.85),
        0 0 28px rgba(180, 190, 200, 0.55);
    }

    /* 80,000円以上：金の光 */
    .total.gold {
      text-shadow:
        0 0 5px #fff4a3,
        0 0 10px #ffd700,
        0 0 18px rgba(255, 215, 0, 0.9),
        0 0 30px rgba(255, 170, 0, 0.6);
    }

    /* 100,000円以上：白金の光 */
    .total.platinum {
      text-shadow:
        0 0 5px #ffffff,
        0 0 10px #eef5ff,
        0 0 18px rgba(210, 225, 255, 0.95),
        0 0 30px rgba(180, 205, 255, 0.7),
        0 0 40px rgba(255, 255, 255, 0.4);
    }

    /* 150,000円以上：ルビーの光 */
    .total.ruby {
      text-shadow:
        0 0 5px #ff6b88,
        0 0 10px #ff1744,
        0 0 18px rgba(255, 23, 68, 0.95),
        0 0 30px rgba(220, 0, 60, 0.7),
        0 0 40px rgba(150, 0, 40, 0.5);
    }

    /* 金額の光をゆっくりキラキラさせる */
    .total.bronze,
    .total.silver,
    .total.gold,
    .total.platinum,
    .total.ruby {
      animation: totalSparkle 1.5s ease-in-out infinite alternate;
    }

    @keyframes totalSparkle {
      0% {
        filter: brightness(0.95);
      }

      50% {
        filter: brightness(1.35);
      }

      100% {
        filter: brightness(1.05);
      }
    }

    /* 10万円以上：白金はさらに強くキラキラ */
    .total.platinum {
      animation: premiumSparkle 0.85s ease-in-out infinite alternate;
    }

    /* 15万円以上：ルビーは最上位のキラキラ */
    .total.ruby {
      animation: rubySparkle 0.65s ease-in-out infinite alternate;
    }

    @keyframes premiumSparkle {
      0% {
        filter: brightness(1);
        transform: scale(1);
      }

      50% {
        filter: brightness(1.6);
        transform: scale(1.015);
      }

      100% {
        filter: brightness(1.15);
        transform: scale(1);
      }
    }

    @keyframes rubySparkle {
      0% {
        filter: brightness(1);
        transform: scale(1);
      }

      40% {
        filter: brightness(1.8);
        transform: scale(1.02);
      }

      70% {
        filter: brightness(1.2);
        transform: scale(1);
      }

      100% {
        filter: brightness(1.6);
        transform: scale(1.015);
      }
    }
/* ========================================
   1,000,000円以上：ゲーミングRGB演出
======================================== */

.total.rainbow {
  animation: gamingRGB 1.4s linear infinite;
}

/* 虹色の光を高速で切り替える */
@keyframes gamingRGB {
  0% {
    text-shadow:
      0 0 7px #ff0000,
      0 0 16px #ff0000,
      0 0 28px #ff0066,
      0 0 40px rgba(255, 0, 0, 0.7);
  }

  16% {
    text-shadow:
      0 0 7px #ff8c00,
      0 0 16px #ff8c00,
      0 0 28px #ffd000,
      0 0 40px rgba(255, 140, 0, 0.7);
  }

  33% {
    text-shadow:
      0 0 7px #ffff00,
      0 0 16px #ffff00,
      0 0 28px #7fff00,
      0 0 40px rgba(255, 255, 0, 0.7);
  }

  50% {
    text-shadow:
      0 0 7px #00ff88,
      0 0 16px #00ff88,
      0 0 28px #00ffff,
      0 0 40px rgba(0, 255, 180, 0.7);
  }

  66% {
    text-shadow:
      0 0 7px #00aaff,
      0 0 16px #00aaff,
      0 0 28px #004cff,
      0 0 40px rgba(0, 120, 255, 0.7);
  }

  83% {
    text-shadow:
      0 0 7px #a020f0,
      0 0 16px #a020f0,
      0 0 28px #ff00ff,
      0 0 40px rgba(180, 0, 255, 0.7);
  }

  100% {
    text-shadow:
      0 0 7px #ff0000,
      0 0 16px #ff0000,
      0 0 28px #ff0066,
      0 0 40px rgba(255, 0, 0, 0.7);
  }
}
    /* ========================================
   10万円・15万円：光の粒キラキラ演出
======================================== */

    .total.platinum,
    .total.ruby {
      position: relative;
      isolation: isolate;
    }

    /* 左上・右側に光の粒を出す */
    .total.platinum::before,
    .total.platinum::after,
    .total.ruby::before,
    .total.ruby::after {
      content: "✦";
      position: absolute;

      font-size: 15px;
      line-height: 1;

      pointer-events: none;

      opacity: 0;

      z-index: 2;
    }

    /* 白金：白～青白い光 */
    .total.platinum::before,
    .total.platinum::after {
      color: #ffffff;

      text-shadow:
        0 0 4px #ffffff,
        0 0 8px #dcecff,
        0 0 14px #b8d7ff;
    }

    /* 白金 左上 */
    .total.platinum::before {
      left: 8%;
      top: -5px;

      animation:
        platinumParticle1 1.4s ease-in-out infinite;
    }

    /* 白金 右側 */
    .total.platinum::after {
      right: 7%;
      bottom: 2px;

      font-size: 11px;

      animation:
        platinumParticle2 1.4s ease-in-out 0.55s infinite;
    }


    /* ルビー：赤～ピンクの光 */
    .total.ruby::before,
    .total.ruby::after {
      color: #ffb3c1;

      text-shadow:
        0 0 4px #ffffff,
        0 0 8px #ff4d6d,
        0 0 15px #ff1744,
        0 0 22px #b00030;
    }

    /* ルビー 左上 */
    .total.ruby::before {
      left: 5%;
      top: -7px;

      font-size: 18px;

      animation:
        rubyParticle1 0.95s ease-in-out infinite;
    }

    /* ルビー 右側 */
    .total.ruby::after {
      right: 5%;
      bottom: 0;

      font-size: 14px;

      animation:
        rubyParticle2 1.1s ease-in-out 0.35s infinite;
    }


    /* 白金キラキラ① */
    @keyframes platinumParticle1 {

      0% {
        opacity: 0;
        transform:
          scale(0.3) rotate(0deg);
      }

      35% {
        opacity: 1;
        transform:
          scale(1.25) rotate(45deg);
      }

      60% {
        opacity: 0.4;
        transform:
          scale(0.7) rotate(80deg);
      }

      100% {
        opacity: 0;
        transform:
          scale(0.2) rotate(120deg);
      }
    }


    /* 白金キラキラ② */
    @keyframes platinumParticle2 {

      0% {
        opacity: 0;
        transform:
          scale(0.2) rotate(0deg);
      }

      45% {
        opacity: 1;
        transform:
          scale(1.1) rotate(-45deg);
      }

      100% {
        opacity: 0;
        transform:
          scale(0.3) rotate(-100deg);
      }
    }


    /* ルビーキラキラ① */
    @keyframes rubyParticle1 {

      0% {
        opacity: 0;
        transform:
          scale(0.2) rotate(0deg);
      }

      30% {
        opacity: 1;
        transform:
          scale(1.4) rotate(45deg);
      }

      55% {
        opacity: 0.5;
        transform:
          scale(0.8) rotate(80deg);
      }

      75% {
        opacity: 1;
        transform:
          scale(1.15) rotate(110deg);
      }

      100% {
        opacity: 0;
        transform:
          scale(0.2) rotate(150deg);
      }
    }


    /* ルビーキラキラ② */
    @keyframes rubyParticle2 {

      0% {
        opacity: 0;
        transform:
          scale(0.2) rotate(0deg);
      }

      40% {
        opacity: 1;
        transform:
          scale(1.3) rotate(-50deg);
      }

      70% {
        opacity: 0.35;
        transform:
          scale(0.6) rotate(-90deg);
      }

      100% {
        opacity: 0;
        transform:
          scale(0.2) rotate(-140deg);
      }
    }

    .notice {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 15px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="top-bar">
      <div class="title">会計電卓</div>

      <button class="checkout" onclick="checkout()">
        会計
      </button>
    </div>

    <div id="display" class="display">0</div>

    <div class="buttons">

      <button class="utility" onclick="backspace()">⌫</button>
      <button class="clear" onclick="clearAll()">C</button>
      <button class="blank" aria-label="空白"></button>
      <button class="operator" onclick="inputOperator('/')">÷</button>

      <button onclick="inputNumber('7')">7</button>
      <button onclick="inputNumber('8')">8</button>
      <button onclick="inputNumber('9')">9</button>
      <button class="operator" onclick="inputOperator('*')">×</button>

      <button onclick="inputNumber('4')">4</button>
      <button onclick="inputNumber('5')">5</button>
      <button onclick="inputNumber('6')">6</button>
      <button class="operator" onclick="inputOperator('-')">−</button>

      <button onclick="inputNumber('1')">1</button>
      <button onclick="inputNumber('2')">2</button>
      <button onclick="inputNumber('3')">3</button>
      <button class="operator" onclick="inputOperator('+')">＋</button>

      <button class="zero" onclick="inputNumber('0')">0</button>
      <button onclick="inputNumber('.')">.</button>
      <button class="equals" onclick="calculate()">＝</button>

    </div>

    <div id="results" class="results">

      <div class="result-card">

        <div class="result-title">
          現金会計　サービス料 5%
        </div>

        <div id="totalCash" class="total">
          0円
        </div>

        <div class="row">
          <span>サービス料 5%</span>
          <span id="serviceCash">0円</span>
        </div>

        <div class="row">
          <span>消費税 10%</span>
          <span id="taxCash">0円</span>
        </div>

      </div>

      <div class="result-card">

        <div class="result-title">
          カード会計　サービス料 10%
        </div>

        <div id="totalCard" class="total">
          0円
        </div>

        <div class="row">
          <span>サービス料 10%</span>
          <span id="serviceCard">0円</span>
        </div>

        <div class="row">
          <span>消費税 10%</span>
          <span id="taxCard">0円</span>
        </div>

      </div>

      <!-- 割り勘 -->

      <div class="split-card">

        <div class="split-title">
          割り勘
        </div>

        <div class="people-control">

          <button class="people-button" onclick="changePeople(-1)">
            −
          </button>

          <div id="peopleNumber" class="people-number">
            2人
          </div>

          <button class="people-button" onclick="changePeople(1)">
            ＋
          </button>

        </div>

        <div class="split-result">

          <div class="split-label">
            現金会計
          </div>

          <div id="splitCash" class="split-amount">
            0円
          </div>

        </div>

        <div class="split-result card">

          <div class="split-label">
            カード会計
          </div>

          <div id="splitCard" class="split-amount">
            0円
          </div>

        </div>

      </div>

      <div class="notice">
        1円未満切り捨て<br>
        計算履歴・会計履歴は保存されません
      </div>

    </div>

  </div>

  <script>

    let expression = "";

    let people = 2;

    let currentTotalCash = 0;
    let currentTotalCard = 0;

    const display =
      document.getElementById("display");


    function updateDisplay() {

      if (expression === "") {
        display.textContent = "0";
        return;
      }

      const formatted = expression
        .split(/([+\-*/])/)
        .map(part => {

          if (/^\d+(\.\d*)?$/.test(part)) {

            const [integer, decimal] =
              part.split(".");

            const commaInteger =
              Number(integer)
                .toLocaleString("ja-JP");

            return decimal !== undefined
              ? commaInteger + "." + decimal
              : commaInteger;
          }

          return part;
        })
        .join("")
        .replaceAll("*", "×")
        .replaceAll("/", "÷");

      display.textContent = formatted;

      display.style.fontSize = "52px";

      let fontSize = 52;

      while (
        display.scrollWidth >
        display.clientWidth &&
        fontSize > 16
      ) {

        fontSize--;

        display.style.fontSize =
          fontSize + "px";
      }
    }


    function hideResults() {

      document.getElementById(
        "results"
      ).style.display = "none";
    }


    function inputNumber(number) {

      hideResults();

      if (number === ".") {

        const parts =
          expression.split(/[+\-*/]/);

        const currentNumber =
          parts[parts.length - 1];

        if (
          currentNumber.includes(".")
        ) {
          return;
        }

        if (currentNumber === "") {
          expression += "0";
        }
      }

      expression += number;

      updateDisplay();
    }


    function inputOperator(operator) {

      hideResults();

      if (expression === "") {
        return;
      }

      const lastCharacter =
        expression[
        expression.length - 1
        ];

      if (
        "+-*/".includes(
          lastCharacter
        )
      ) {

        expression =
          expression.slice(0, -1)
          + operator;

      } else {

        expression += operator;

      }

      updateDisplay();
    }


    function clearAll() {

      expression = "";

      updateDisplay();

      hideResults();
    }


    function backspace() {

      expression =
        expression.slice(0, -1);

      updateDisplay();

      hideResults();
    }


    function endsWithOperator() {

      if (expression === "") {
        return false;
      }

      const lastCharacter =
        expression[
        expression.length - 1
        ];

      return "+-*/".includes(
        lastCharacter
      );
    }


    function getResult() {

      if (expression === "") {
        return 0;
      }

      if (
        !/^[0-9+\-*/.]+$/.test(
          expression
        )
      ) {
        return null;
      }

      try {

        const result =
          Function(
            '"use strict"; return (' +
            expression +
            ')'
          )();

        if (
          !Number.isFinite(result)
        ) {
          return null;
        }

        return result;

      } catch {

        return null;
      }
    }


    function calculate() {

      /*
        ＋ − × ÷ で終わっている場合は
        何もせず、そのままにする
      */
      if (endsWithOperator()) {
        return;
      }

      const result = getResult();

      if (result === null) {

        display.textContent =
          "エラー";

        return;
      }

      expression =
        String(result);

      updateDisplay();
    }


    function yen(number) {

      return (
        Math.floor(number)
          .toLocaleString("ja-JP")
        + "円"
      );
    }


    /* 割り勘計算 */

    function makeSplitText(
      total,
      count
    ) {

      const basic =
        Math.floor(total / count);

      const remainder =
        total % count;

      if (remainder === 0) {

        return (
          yen(basic) +
          " × " +
          count +
          "人"
        );
      }

      const high =
        basic + 1;

      const highCount =
        remainder;

      const lowCount =
        count - remainder;

      let text = "";

      if (highCount > 0) {

        text +=
          yen(high) +
          " × " +
          highCount +
          "人";
      }

      if (lowCount > 0) {

        if (text !== "") {
          text += "<br>";
        }

        text +=
          yen(basic) +
          " × " +
          lowCount +
          "人";
      }

      return text;
    }


    function updateSplit() {

      document.getElementById(
        "peopleNumber"
      ).textContent =
        people + "人";

      document.getElementById(
        "splitCash"
      ).innerHTML =
        makeSplitText(
          currentTotalCash,
          people
        );

      document.getElementById(
        "splitCard"
      ).innerHTML =
        makeSplitText(
          currentTotalCard,
          people
        );
    }


    function changePeople(change) {

      people += change;

      if (people < 2) {
        people = 2;
      }

      if (people > 10) {
        people = 10;
      }

      updateSplit();
    }


    function checkout() {
      /* 税抜合計に応じて会計金額の色を変更 */
      function applyTotalRank(base) {

        const totalCashElement =
          document.getElementById("totalCash");

        const totalCardElement =
          document.getElementById("totalCard");

        const ranks = [
          "bronze",
          "silver",
          "gold",
          "platinum",
          "ruby",
          "rainbow"
        ];

        totalCashElement.classList.remove(...ranks);
        totalCardElement.classList.remove(...ranks);

        let rank = "";

        if (base >= 1000000) {
          rank = "rainbow";
        } else if (base >= 150000) {
          rank = "ruby";
        } else if (base >= 100000) {
          rank = "platinum";
        } else if (base >= 80000) {
          rank = "gold";
        } else if (base >= 50000) {
          rank = "silver";
        } else if (base >= 30000) {
          rank = "bronze";
        }

        if (rank !== "") {
          totalCashElement.classList.add(rank);
          totalCardElement.classList.add(rank);
        }
      }
      /*
        会計も演算子で終わっている場合は
        誤操作防止のため何もしない
      */
      if (endsWithOperator()) {
        return;
      }

      const base = getResult();
      applyTotalRank(base);

      if (
        base === null ||
        base < 0
      ) {

        display.textContent =
          "エラー";

        return;
      }


      /* 現金：サービス料5% → 消費税10% */

      const serviceCash =
        Math.floor(base * 0.05);

      const subtotalCash =
        base + serviceCash;

      const taxCash =
        Math.floor(
          subtotalCash * 0.10
        );

      const totalCash =
        Math.floor(
          subtotalCash + taxCash
        );


      /* カード：サービス料10% → 消費税10% */

      const serviceCard =
        Math.floor(base * 0.10);

      const subtotalCard =
        base + serviceCard;

      const taxCard =
        Math.floor(
          subtotalCard * 0.10
        );

      const totalCard =
        Math.floor(
          subtotalCard + taxCard
        );


      currentTotalCash =
        totalCash;

      currentTotalCard =
        totalCard;


      document.getElementById(
        "serviceCash"
      ).textContent =
        yen(serviceCash);

      document.getElementById(
        "taxCash"
      ).textContent =
        yen(taxCash);

      document.getElementById(
        "totalCash"
      ).textContent =
        yen(totalCash);


      document.getElementById(
        "serviceCard"
      ).textContent =
        yen(serviceCard);

      document.getElementById(
        "taxCard"
      ).textContent =
        yen(taxCard);

      document.getElementById(
        "totalCard"
      ).textContent =
        yen(totalCard);


      /* 割り勘人数を毎回2人に戻す */

      people = 2;

      updateSplit();


      document.getElementById(
        "results"
      ).style.display =
        "block";
    }

  </script>


  <script>
    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker.register(
            "./service-worker.js"
          );

        }
      );
    }
  </script>

</body>

</html>
